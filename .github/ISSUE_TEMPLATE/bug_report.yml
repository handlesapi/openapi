name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Never paste your API key. Quote the `request_id` from the error response if you have one, it lets us find the call.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code or curl command that shows it.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "Spec version 1.0.0, or n/a"
  - type: input
    id: tool
    attributes:
      label: Tool and version, if a tool complained
      placeholder: "openapi-typescript 7.4"
